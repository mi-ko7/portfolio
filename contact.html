<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Mikiko Portfolio</title>
    <!-- Google　font読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS読み込み -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="contact-page">
    <header class="header">
      <div class="header__inner">
        <div class="header__logo">
          <a href="index.html">Mikiko Portfolio </a>
        </div>
        <nav class="header__nav">
          <ul class="nav__list">
            <li class="nav__item"><a href="about.html">About</a></li>
            <li class="nav__item"><a href="works.html">Works</a></li>
            <li class="nav__item"><a href="#contact">Contact</a></li>
          </ul>
        </nav>
        <div class="hamburger">
          <span class="hamburger__bar"></span>
          <span class="hamburger__bar"></span>
          <span class="hamburger__bar"></span>
        </div>
        <nav class="drawer__nav">
          <ul class="drawer__nav-list">
            <li class="drawer__nav-list">
              <a href="about.html">About</a>
              <span>私について</span>
            </li>
            <li class="drawer__nav-list">
              <a href="works.html">Works</a>
              <span>制作実績</span>
            </li>
            <li class="drawer__nav-list">
              <a href="contact.html">Contact</a>
              <span>お問い合わせ</span>
            </li>
          </ul>
        </nav>
        <div class="drawer__overlay"></div>
      </div>
    </header>

    <main>
      <section class="mv">
        <div class="mv__bg"></div>
        <div class="mv__inner">
          <div class="mv__content">
            <p class="mv__title">
              Contact
            </p>
            <p class="mv__text">
              ご質問・ご相談などございましたら <br>
              お気軽にご連絡ください。
            </p>
          </div>
        </div>
      </section>


      <section id="contact" class="contact" data-aos="fade-up">
        <div class="contact__inner">
          <h2 class="sec__ttl">Contact</h2>
          <div
            class="frm-container"
            data-aos="zoom-in-up"
            data-aos-duration="1000"
          >
            <p class="contact__text">＊は入力必須項目です</p>
            <div class="form-inner">
              <div class="form-group">
                <label for="your-name">お名前 ＊</label>
                <input type="text" id="your-name" name="your-name" />
              </div>
              <div class="form-group">
                <label for="your-email">メールアドレス ＊</label>
                <input type="email" id="your-email" name="your-email" />
              </div>
              <div class="form-group">
                <label for="your-name">法人/個人の選択 ＊</label>
                <div class="form-select">
                  <div class="form-radio">
                    <input
                      type="radio"
                      id="type-corporete"
                      name="your-type"
                      value="法人"
                      checked
                    />
                    <label for="type-corporete">法人</label>
                  </div>
                  <div class="form-radio">
                    <input
                      type="radio"
                      id="type-individual"
                      name="your-type"
                      value="個人"
                    />
                    <label for="type-individual">個人</label>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="your-message">お問い合わせ内容 ＊</label>
                <textarea id="your-massage" name="your-messge"></textarea>
              </div>

              <div class="form-privacy">
                <label class="form-privacy__label">
                  <input type="checkbox" name="privacy" required />
                  <span class="form-privacy__text">
                    <a href="privacy.html" target="_blank"
                      >プライバシーポリシー</a
                    >に同意します。
                  </span>
                </label>
              </div>

              <button type="submit" class="form-btn">送信</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__logo">
          <a href="index.html"></a>Mikiko Portfolio
        </div>
        <nav class="footer__nav">
          <ul class="footer__list">
            <li class="footer__item"><a href="#about">About</a></li>
            <li class="footer__item"><a href="#works">Works</a></li>
            <li class="footer__item"><a href="#contact">Contact</a></li>
          </ul>
        </nav>

        <p class="footer__copyright">
          <small>© 2026 Mikiko All rights reserved</small>
        </p>
      </div>
    </footer>
    <script src="./js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        offset: 100, // スクロールしてから動くまでの距離
        duration: 1000, // アニメーションにかける時間(ミリ秒)
        easing: "ease", // 動き方
        once: true, // 一回きり（スクロールを戻しても消えない）
      });
    </script>
  </body>
</html>
